name: Windows ARM32 SDK host tools

on:
  workflow_dispatch:
    inputs:
      windows_sdk_assembly:
        description: Assemble both engine families with native Windows SDK dependencies
        type: boolean
        default: false
      windows_resources:
        description: Build common LLVM Windows resource utilities
        type: boolean
        default: false
      windows_compiler:
        description: Cross-build Windows x64 compiler using verified Python payloads
        type: boolean
        default: false
      windows_flutter_bootstrap:
        description: Execute normal flutter.bat bootstrap and Unicode relocation under Wine
        type: boolean
        default: false
      sdk_host_bootstrap:
        description: Stage current port sources with exact official caches for all four SDK hosts
        type: boolean
        default: false
      windows_rust:
        description: Verify complete Windows x64 Rust toolchains under Wine
        type: boolean
        default: false
      frontend_generators:
        description: Build Linux-host frontend AOT generators for all official SDK host targets
        type: boolean
        default: false
      frontend_snapshots:
        description: Generate matching source frontend AOT snapshots using verified cross generators
        type: boolean
        default: false
      frontend_generator_run_id:
        description: Successful four-host frontend cross-generator workflow run
        default: ''
      windows_frontend_runtime:
        description: Execute the generated Windows frontend on the official Windows Dart runtime
        type: boolean
        default: false
      frontend_snapshot_run_id:
        description: Successful generated four-host frontend workflow run
        default: '38445964591'
      frontend_platform_run_id:
        description: Matching source-built ARM32 platform workflow run
        default: '38423410946'
      windows_msix:
        description: Cross-build and execute the full upstream Windows MSIX packager
        type: boolean
        default: false
      msix_fixture_run_id:
        description: Successful source-build run containing the real Phone packaging fixture
        default: '38423410946'
      msix_packager_run_id:
        description: Reuse a source-built Windows packager only for runtime packaging tests
        default: ''
      msix_xml_parser:
        description: Upstream Windows XML backend with full schema validation
        type: choice
        options: [msxml6, xerces]
        default: msxml6
      windows_snapshot:
        description: Build and execute Windows x64 ARM32 snapshot generator from current Dart source
        type: boolean
        default: false
      snapshot_frontend_run_id:
        description: Current-source Linux frontend and Windows ARM32 platform build
        default: '38402528937'
      snapshot_aot:
        description: Generate a real ARM32 AOT ELF using the native Windows generator
        type: boolean
        default: false
      snapshot_generator_run_id:
        description: Reuse an audited current-source Windows generator for runtime verification only
        default: ''
      snapshot_compiler_run_id:
        description: Successful Linux source-built common compiler workflow run
        default: '38402528937'
      windows_compiler_runtime:
        description: Execute the packaged Windows compiler and its compatibility regression tests
        type: boolean
        default: false
      compiler_package_run_id:
        description: Successful packaged Windows compiler workflow run
        default: '38400781351'
      python_run_id:
        description: Successful four-host Python payload workflow run
        default: '38388564532'
      windows_compiler_run_id:
        description: Successful raw Windows compiler build to package without recompiling
        default: ''
  push:
    branches: [windows-arm32-3.38.10]
    paths:
      - dev/windows_arm32/sdk-hosts.json
      - dev/windows_arm32/sdk_hosts.py
      - dev/windows_arm32/toolchain/*windows*launcher*
      - .github/workflows/windows-arm32-host-tools.yml

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  windows_launchers:
    if: ${{ !inputs.windows_resources && !inputs.windows_sdk_assembly && !inputs.windows_flutter_bootstrap && !inputs.sdk_host_bootstrap && !inputs.windows_compiler && !inputs.windows_rust && !inputs.windows_compiler_runtime && !inputs.windows_snapshot && !inputs.windows_msix && !inputs.frontend_generators && !inputs.frontend_snapshots && !inputs.windows_frontend_runtime }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/_work/tmp
    steps:
      - name: Prepare Ubuntu amd64 container
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$TMPDIR"
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 \
            xz-utils gnupg xvfb xauth imagemagick
          mkdir -p /etc/apt/keyrings
          curl --fail --location --retry 3 https://dl.winehq.org/wine-builds/winehq.key \
            --output /etc/apt/keyrings/winehq.asc
          echo 'd965d646defe94b3dfba6d5b4406900ac6c81065428bf9d9303ad7a72ee8d1b8  /etc/apt/keyrings/winehq.asc' | sha256sum --check
          gpg --batch --dearmor --output /etc/apt/keyrings/winehq-archive.key /etc/apt/keyrings/winehq.asc
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources \
            --output /etc/apt/sources.list.d/winehq-noble.sources
          echo 'b5962429ece1f831c9f713c13f9f0d26bb367117ef56706648ff385f004779fb  /etc/apt/sources.list.d/winehq-noble.sources' | sha256sum --check
          apt-get update
          apt-get install -y --install-recommends winehq-stable=11.0.0.0~noble-1
          # Supply Wine 11's standard addons before prefix initialization;
          # otherwise its interactive Mono installer blocks unattended tests.
          # SHA-256 values come from Wine 11.0 dlls/appwiz.cpl/addons.c.
          mkdir -p /opt/wine/mono /opt/wine/gecko
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-mono/10.4.1/wine-mono-10.4.1-x86.msi \
            --output /opt/wine/mono/wine-mono-10.4.1-x86.msi
          echo '071f4b2887e1c97a11d791ff3d65be9429eed6dec4c2708888bfd546ba358e23  /opt/wine/mono/wine-mono-10.4.1-x86.msi' | sha256sum --check
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86.msi \
            --output /opt/wine/gecko/wine-gecko-2.47.4-x86.msi
          echo '26cecc47706b091908f7f814bddb074c61beb8063318e9efc5a7f789857793d6  /opt/wine/gecko/wine-gecko-2.47.4-x86.msi' | sha256sum --check
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86_64.msi \
            --output /opt/wine/gecko/wine-gecko-2.47.4-x86_64.msi
          echo 'e590b7d988a32d6aa4cf1d8aa3aa3d33766fdd4cf4c89c2dcc2095ecb28d066f  /opt/wine/gecko/wine-gecko-2.47.4-x86_64.msi' | sha256sum --check
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare pinned cross compiler and official Windows Python
        run: |
          mkdir -p _work/tmp
          export TMPDIR="$GITHUB_WORKSPACE/_work/tmp"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          archive=llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl --fail --location --retry 3 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20251104/$archive" \
            --output "_work/$archive"
          echo "3aed6fa47be909884cb3e5634d6b7254604d7104832d6312f8435fb23d5a9bab  _work/$archive" | sha256sum --check
          tar -xf "_work/$archive" -C _work
          curl --fail --location --retry 3 \
            https://www.python.org/ftp/python/3.14.6/python-3.14.6-embed-amd64.zip \
            --output _work/python-windows.zip
          echo 'df901e84a896ff1ee720ad03377e0c8d8c2244fda79808aeeaff6316df1cb75c  _work/python-windows.zip' | sha256sum --check
      - name: Cross-build Windows x64 launcher from source
        run: |
          python3 dev/windows_arm32/toolchain/build_windows_launcher.py \
            --compiler _work/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang \
            --output _work/launcher/sdk-python-launcher.exe
      - name: Verify Windows arguments, Unicode paths, streams and relocation
        run: |
          xvfb-run -a python3 dev/windows_arm32/toolchain/check_windows_launchers.py \
            --launcher _work/launcher/sdk-python-launcher.exe \
            --python-archive _work/python-windows.zip --output _work/launcher-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-arm32-windows-x64-launcher
          path: |
            _work/launcher/sdk-python-launcher.exe
            _work/launcher/sdk-python-launcher.provenance.json
            _work/launcher-check/verification.json
            _work/launcher-check/wine-baseline.json
            _work/launcher-check/*-stdout.log
            _work/launcher-check/*-stderr.log
            _work/launcher-check/wine-desktop.png
          if-no-files-found: warn
  python_payloads:
    if: ${{ !inputs.windows_resources && !inputs.windows_sdk_assembly && !inputs.windows_flutter_bootstrap && !inputs.sdk_host_bootstrap && !inputs.windows_compiler && !inputs.windows_rust && !inputs.windows_compiler_runtime && !inputs.windows_snapshot && !inputs.windows_msix && !inputs.frontend_generators && !inputs.frontend_snapshots && !inputs.windows_frontend_runtime }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [linux-x64, macos-x64, macos-arm64, windows-x64]
    steps:
      - name: Prepare native packaging tools in Ubuntu amd64
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$GITHUB_WORKSPACE/_work/tmp"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl \
            python3 python3-pip zstd patchelf binutils llvm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stage exact host Python and Pillow with native dependency auditing
        env:
          SDK_HOST: ${{ matrix.host }}
        run: |
          mkdir -p _work/tmp
          export TMPDIR="$GITHUB_WORKSPACE/_work/tmp"
          export TMP="$TMPDIR" TEMP="$TMPDIR" PYTHONDONTWRITEBYTECODE=1
          python3 -B - <<'PY'
          import os, subprocess, sys, tarfile
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          sys.path.insert(0, 'dev/windows_arm32/toolchain')
          from prepare_python import prepare, inputs
          from sdk_hosts import select_host
          host = select_host(os.environ['SDK_HOST'])
          record = inputs(host)
          work = Path('_work').resolve()
          archive = work / 'python-source.tar.zst'
          wheel = work / unquote(Path(urlparse(record['wheelUrl']).path).name)
          for url, destination in ((record['archiveUrl'], archive), (record['wheelUrl'], wheel)):
              subprocess.run(['curl', '--fail', '--location', '--retry', '3',
                              url, '--output', str(destination)], check=True)
          stage = prepare(archive, wheel, work / 'python', host=host['id'],
                          installer_python=Path(sys.executable),
                          llvm_readobj=Path('/usr/bin/llvm-readobj'),
                          llvm_objdump=Path('/usr/bin/llvm-objdump'))
          with tarfile.open(work / ('python-' + host['id'] + '.tar.gz'), 'w:gz') as package:
              package.add(stage, arcname='.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm32-python-${{ matrix.host }}
          path: |
            _work/python-${{ matrix.host }}.tar.gz
            _work/python/python-provenance.json
          if-no-files-found: error
  windows_compiler:
    if: inputs.windows_compiler
    uses: ./.github/workflows/windows-arm32-windows-compiler.yml
    with:
      python_run_id: ${{ inputs.python_run_id }}
      compiler_run_id: ${{ inputs.windows_compiler_run_id }}
      compile: true
  windows_rust:
    if: inputs.windows_rust
    env:
      TMPDIR: ${{ github.workspace }}/_work/tmp
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1.95.0', '1.93.1']
    steps:
      - name: Prepare Ubuntu amd64 container
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$TMPDIR"
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 \
            xz-utils gnupg xvfb xauth imagemagick binutils llvm
          mkdir -p /etc/apt/keyrings
          curl --fail --location --retry 3 https://dl.winehq.org/wine-builds/winehq.key \
            --output /etc/apt/keyrings/winehq.asc
          echo 'd965d646defe94b3dfba6d5b4406900ac6c81065428bf9d9303ad7a72ee8d1b8  /etc/apt/keyrings/winehq.asc' | sha256sum --check
          gpg --batch --dearmor --output /etc/apt/keyrings/winehq-archive.key /etc/apt/keyrings/winehq.asc
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources \
            --output /etc/apt/sources.list.d/winehq-noble.sources
          echo 'b5962429ece1f831c9f713c13f9f0d26bb367117ef56706648ff385f004779fb  /etc/apt/sources.list.d/winehq-noble.sources' | sha256sum --check
          apt-get update
          apt-get install -y --install-recommends winehq-stable=11.0.0.0~noble-1
          # Supply Wine 11's standard addons before prefix initialization;
          # otherwise its interactive Mono installer blocks unattended tests.
          # SHA-256 values come from Wine 11.0 dlls/appwiz.cpl/addons.c.
          mkdir -p /opt/wine/mono /opt/wine/gecko
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-mono/10.4.1/wine-mono-10.4.1-x86.msi \
            --output /opt/wine/mono/wine-mono-10.4.1-x86.msi
          echo '071f4b2887e1c97a11d791ff3d65be9429eed6dec4c2708888bfd546ba358e23  /opt/wine/mono/wine-mono-10.4.1-x86.msi' | sha256sum --check
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86.msi \
            --output /opt/wine/gecko/wine-gecko-2.47.4-x86.msi
          echo '26cecc47706b091908f7f814bddb074c61beb8063318e9efc5a7f789857793d6  /opt/wine/gecko/wine-gecko-2.47.4-x86.msi' | sha256sum --check
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86_64.msi \
            --output /opt/wine/gecko/wine-gecko-2.47.4-x86_64.msi
          echo 'e590b7d988a32d6aa4cf1d8aa3aa3d33766fdd4cf4c89c2dcc2095ecb28d066f  /opt/wine/gecko/wine-gecko-2.47.4-x86_64.msi' | sha256sum --check
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install exact official Windows Rust components in private directories
        env:
          RUST_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p _work/tmp
          export TMPDIR="$GITHUB_WORKSPACE/_work/tmp"
          export CARGO_HOME="$GITHUB_WORKSPACE/_work/cargo"
          export RUSTUP_HOME="$GITHUB_WORKSPACE/_work/rustup"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            --output _work/rustup-init
          echo '20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  _work/rustup-init' | sha256sum --check
          chmod +x _work/rustup-init
          _work/rustup-init -y --no-modify-path --default-toolchain none
          "$CARGO_HOME/bin/rustup" toolchain install "$RUST_VERSION-x86_64-pc-windows-gnu" \
            --force-non-host --no-self-update --profile minimal --component rust-src
          curl --fail --location --retry 3 \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-pc-windows-msvc/rustup-init.exe \
            --output _work/rustup-windows.exe
          echo '88d8258dcf6ae4f7a80c7d1088e1f36fa7025a1cfd1343731b4ee6f385121fc0  _work/rustup-windows.exe' | sha256sum --check
      - name: Prepare source-built native launcher and official Windows Python for adapter checks
        run: |
          archive=llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl --fail --location --retry 3 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20251104/$archive" \
            --output "_work/$archive"
          echo "3aed6fa47be909884cb3e5634d6b7254604d7104832d6312f8435fb23d5a9bab  _work/$archive" | sha256sum --check
          tar -xf "_work/$archive" -C _work
          python3 -B dev/windows_arm32/toolchain/build_windows_launcher.py \
            --compiler _work/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang \
            --output _work/launcher/sdk-python-launcher.exe
          curl --fail --location --retry 3 \
            https://www.python.org/ftp/python/3.14.6/python-3.14.6-embed-amd64.zip \
            --output _work/python-windows.zip
          echo 'df901e84a896ff1ee720ad03377e0c8d8c2244fda79808aeeaff6316df1cb75c  _work/python-windows.zip' | sha256sum --check
      - name: Execute original and staged Rust compiler; audit full Windows component payload
        env:
          RUST_VERSION: ${{ matrix.version }}
        run: |
          export WINEPREFIX="$GITHUB_WORKSPACE/_work/wine-prefix" WINEARCH=win64
          xvfb-run -a python3 -B dev/windows_arm32/toolchain/prepare_rust_distribution.py \
            --host windows-x64 --runner wine --version "$RUST_VERSION" \
            --rustc "_work/rustup/toolchains/$RUST_VERSION-x86_64-pc-windows-gnu/bin/rustc.exe" \
            --rustup _work/rustup-windows.exe --llvm-readobj /usr/bin/llvm-readobj \
            --output _work/distribution
          tar -czf "_work/windows-arm32-rust-$RUST_VERSION-windows-x64.tar.gz" -C _work/distribution .
      - name: Verify native Rust and Cargo adapter invocation after Unicode SDK relocation
        run: |
          export WINEPREFIX="$GITHUB_WORKSPACE/_work/wine-prefix" WINEARCH=win64
          xvfb-run -a python3 -B dev/windows_arm32/toolchain/check_windows_rust_adapters.py \
            --distribution _work/distribution --launcher _work/launcher/sdk-python-launcher.exe \
            --python-archive _work/python-windows.zip --output _work/adapter-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm32-rust-${{ matrix.version }}-windows-x64
          path: |
            _work/windows-arm32-rust-${{ matrix.version }}-windows-x64.tar.gz
            _work/distribution/rust-distribution-provenance.json
            _work/adapter-check/verification.json
          if-no-files-found: error
  windows_compiler_runtime:
    if: inputs.windows_compiler_runtime
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/_work/tmp
    steps:
      - name: Prepare Ubuntu amd64 container
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$TMPDIR"
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 \
            xz-utils gnupg xvfb xauth imagemagick
          mkdir -p /etc/apt/keyrings
          curl --fail --location --retry 3 https://dl.winehq.org/wine-builds/winehq.key \
            --output /etc/apt/keyrings/winehq.asc
          echo 'd965d646defe94b3dfba6d5b4406900ac6c81065428bf9d9303ad7a72ee8d1b8  /etc/apt/keyrings/winehq.asc' | sha256sum --check
          gpg --batch --dearmor --output /etc/apt/keyrings/winehq-archive.key /etc/apt/keyrings/winehq.asc
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources \
            --output /etc/apt/sources.list.d/winehq-noble.sources
          echo 'b5962429ece1f831c9f713c13f9f0d26bb367117ef56706648ff385f004779fb  /etc/apt/sources.list.d/winehq-noble.sources' | sha256sum --check
          apt-get update
          apt-get install -y --install-recommends winehq-stable=11.0.0.0~noble-1
          # Supply Wine 11's standard addons before prefix initialization;
          # otherwise its interactive Mono installer blocks unattended tests.
          # SHA-256 values come from Wine 11.0 dlls/appwiz.cpl/addons.c.
          mkdir -p /opt/wine/mono /opt/wine/gecko
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-mono/10.4.1/wine-mono-10.4.1-x86.msi \
            --output /opt/wine/mono/wine-mono-10.4.1-x86.msi
          echo '071f4b2887e1c97a11d791ff3d65be9429eed6dec4c2708888bfd546ba358e23  /opt/wine/mono/wine-mono-10.4.1-x86.msi' | sha256sum --check
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86.msi \
            --output /opt/wine/gecko/wine-gecko-2.47.4-x86.msi
          echo '26cecc47706b091908f7f814bddb074c61beb8063318e9efc5a7f789857793d6  /opt/wine/gecko/wine-gecko-2.47.4-x86.msi' | sha256sum --check
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86_64.msi \
            --output /opt/wine/gecko/wine-gecko-2.47.4-x86_64.msi
          echo 'e590b7d988a32d6aa4cf1d8aa3aa3d33766fdd4cf4c89c2dcc2095ecb28d066f  /opt/wine/gecko/wine-gecko-2.47.4-x86_64.msi' | sha256sum --check
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-arm32-compiler-windows-x64
          run-id: ${{ inputs.compiler_package_run_id }}
          github-token: ${{ github.token }}
          path: _work/compiler-input
      - name: Extract and verify packaged native compiler files
        run: |
          mkdir -p _work/tmp _work/compiler
          echo "TMPDIR=$GITHUB_WORKSPACE/_work/tmp" >> "$GITHUB_ENV"
          cd _work/compiler-input
          sha256sum --check windows-arm32-compiler-windows-x64.tar.gz.sha256
