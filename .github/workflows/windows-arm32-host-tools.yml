  sdk_host_bootstrap:
    if: ${{ !inputs.windows_resources && !inputs.windows_sdk_assembly && (inputs.sdk_host_bootstrap || inputs.windows_flutter_bootstrap) }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        host: ${{ inputs.windows_flutter_bootstrap && fromJSON('["windows-x64"]') || fromJSON('["linux-x64", "windows-x64", "macos-x64", "macos-arm64"]') }}
    steps:
      - name: Prepare ordinary Ubuntu amd64 container
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$GITHUB_WORKSPACE/_work/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/_work/tmp" >> "$GITHUB_ENV"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates python3 xz-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          fetch-tags: true
          persist-credentials: false
      - name: Stage exact official host cache with relocatable current port sources
        env:
          SDK_HOST: ${{ matrix.host }}
        run: |
          mkdir -p _work/tmp
          export TMPDIR="$PWD/_work/tmp" TMP="$PWD/_work/tmp" TEMP="$PWD/_work/tmp"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          python3 -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from dev.windows_arm32.sdk_hosts import select_host
          host = select_host(os.environ['SDK_HOST'])
          archive = Path('_work') / Path(host['officialArchive']).name
          subprocess.run(['curl', '--fail', '--location', '--retry', '3',
              'https://storage.googleapis.com/flutter_infra_release/releases/' + host['officialArchive'],
              '--output', str(archive)], check=True)
          subprocess.run(['python3', '-B', 'dev/windows_arm32/bootstrap_host_sdk.py',
              '--archive', str(archive), '--host', host['id'], '--sdk', '_work/host SDK 日本語'], check=True)
          sdk = Path('_work/host SDK 日本語')
          record = json.loads((sdk / 'bin/cache/windows-arm32-host-bootstrap.json').read_text())
          record['bundledWindowsGitIncluded'] = (sdk / 'bin/mingit/cmd/git.exe').is_file()
          record['ordinaryFlutterBuildVerified'] = False
          Path('_work/bootstrap-verification.json').write_text(json.dumps(record, indent=2) + '\n')
          # This job checks official host inputs. Native compiler/engine
          # assembly and unchanged application builds are subsequent gates.
          PY
      - uses: ./.github/actions/windows-host-runtime
        if: ${{ inputs.windows_flutter_bootstrap }}
        env:
          TMPDIR: ${{ github.workspace }}/_work/tmp
      - name: Prepare official native PowerShell only for CI bootstrap verification
        if: ${{ inputs.windows_flutter_bootstrap }}
        run: |
          mkdir -p _work/powershell-native
          curl --fail --location --connect-timeout 30 --max-time 300 \
            --retry 3 --retry-max-time 600 \
            https://github.com/PowerShell/PowerShell/releases/download/v7.4.13/PowerShell-7.4.13-win-x64.zip \
            --output _work/powershell.zip
          echo '8fb52d2172d285b230c2857a90ba4dd28ecf6477ba4a91f91b6854a647b33b65  _work/powershell.zip' | sha256sum --check
          python3 -B -m zipfile -e _work/powershell.zip _work/powershell-native
      - name: Execute normal Windows Flutter bootstrap before and after relocation
        if: ${{ inputs.windows_flutter_bootstrap }}
        run: |
          xvfb-run -a python3 -B dev/windows_arm32/check_windows_flutter_bootstrap.py \
            --sdk '_work/host SDK 日本語' --powershell _work/powershell-native/pwsh.exe \
            --output _work/flutter-bootstrap-check --trace-bootstrap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-arm32-sdk-bootstrap-${{ matrix.host }}
          path: |
            _work/bootstrap-verification.json
            _work/flutter-bootstrap-check/verification.json
            _work/flutter-bootstrap-check/wine-where-verification.json
            _work/flutter-bootstrap-check/wine-handles-verification.json
            _work/flutter-bootstrap-check/wine-exit-status-verification.json
            _work/flutter-bootstrap-check/*trace-stdout.log
            _work/flutter-bootstrap-check/*trace-stderr.log
            _work/flutter-bootstrap-check/*-stdout.log
            _work/flutter-bootstrap-check/*-stderr.log
            _work/flutter-bootstrap-check/*-process.json
          if-no-files-found: error

  windows_sdk_assembly:
    if: ${{ inputs.windows_sdk_assembly }}
    uses: ./.github/workflows/windows-arm32-windows-sdk.yml

  windows_resources:
    if: inputs.windows_resources
    uses: ./.github/workflows/windows-arm32-windows-compiler.yml
    with:
      python_run_id: ${{ inputs.python_run_id }}
      compile: true
      resources_only: true
