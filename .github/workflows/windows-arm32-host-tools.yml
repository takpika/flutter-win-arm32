            --generator _work/windows-snapshot/build/gen_snapshot.exe \
            --dart _work/aot-bootstrap/dart-sdk/bin/dart --output _work/windows-snapshot/aot-check \
            --frontend-server _work/aot-platform/frontend_server_aot.dart.snapshot \
            --patched-sdk _work/aot-platform/flutter_patched_sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-arm32-snapshot-windows-x64
          path: |
