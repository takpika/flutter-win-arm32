            --engine-provenance _work/platform/engine-build-provenance.json \
            --output _work/frontend-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-arm32-windows-frontend-runtime
          path: |
