          github-token: ${{ github.token }}
          path: _work/windows-snapshot
      - name: Verify generator matches the current source manifests
        run: |
          python3 -B - <<'PYAUDIT'
          import hashlib, json
          from pathlib import Path
          from dev.windows_arm32.sdk_hosts import select_host, verify_native_host
          output = Path('_work/windows-snapshot')
          record = json.loads((output / 'snapshot-provenance.json').read_text())
          expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(Path('dev/windows_arm32/patches').glob('*-source-manifest.json'))}
          image = output / 'build/gen_snapshot.exe'
          host_paths = ['dev/windows_arm32/build_windows_snapshot.py',
                        *('dev/windows_arm32/toolchain/' + name for name in (
                            'windows_snapshot_driver.py', 'gnu_driver.py', 'msvc_options.py', 'windows_header_vfs.py'))]
          host_inputs = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in host_paths}
          if record.get('hostBuildInputs') != host_inputs:
              raise SystemExit('Snapshot host compiler driver/configuration differs from this source build')
          verify_native_host(image, select_host('windows-x64'))
          if (not record['sourceBuilt'] or record['host'] != 'windows-x64' or
              record['dartTargetArchitecture'] != 'arm' or record['sourceManifests'] != expected or
              hashlib.sha256(image.read_bytes()).hexdigest() != record['generatorSha256']):
              raise SystemExit('Snapshot generator differs from the current source build')
          PYAUDIT
      - name: Execute the native Windows generator under Wine
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_work/tmp"
          export TMPDIR="$GITHUB_WORKSPACE/_work/tmp"
          xvfb-run -a python3 -B - <<'PYVERIFY'
          import json, os, subprocess
          from pathlib import Path
          output = Path('_work/windows-snapshot')
          result = subprocess.run(['wine', str((output / 'build/gen_snapshot.exe').resolve()), '--help'],
                                  env=dict(os.environ, WINEPREFIX=str(Path('_work/wine-snapshot').resolve()), WINEDEBUG='-all'),
                                  capture_output=True, text=True, timeout=120)
          (output / 'runtime-stdout.log').write_text(result.stdout)
          (output / 'runtime-stderr.log').write_text(result.stderr)
          if result.returncode != 0 or 'Usage: gen_snapshot' not in result.stdout + result.stderr:
              raise SystemExit('Native Windows snapshot generator did not execute successfully')
          proof = json.loads((output / 'snapshot-provenance.json').read_text())
          proof.update(runtimeExecutionVerified=True, runtimeVerification='Wine 11 --help',
                       fullSdkArm32AppBuildVerified=False)
          (output / 'snapshot-provenance.json').write_text(json.dumps(proof, indent=2) + '\n')
          PYVERIFY
