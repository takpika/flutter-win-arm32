              raise SystemExit('Existing packager uses another upstream XML backend')
          if record.get('sourceBuilt') is not True or record.get('systemLibrariesCopied') is not False:
              raise SystemExit('Select an audited source-built Windows packager')
          for name, sha in record['files'].items():
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != sha:
                  raise SystemExit('Windows MSIX distribution file changed: ' + name)
          PY
      - name: Verify native Windows CLI execution and Unicode relocation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_work/tmp"
          export TMPDIR="$GITHUB_WORKSPACE/_work/tmp"
          xvfb-run -a python3 -B - <<'PYVERIFY'
          import json, os, subprocess
          from pathlib import Path
          root = Path('_work/windows-msix')
          distribution = root / 'distribution'
          moved = root / 'MSIX moved 日本語'
          distribution.rename(moved)
          result = subprocess.run(['wine', str((moved / 'bin/makemsix.exe').resolve()), '-?'],
              env=dict(os.environ, WINEPREFIX=str(Path('_work/wine-msix').resolve()), WINEDEBUG='-all'),
              capture_output=True, text=True, timeout=120)
          (root / 'runtime-stdout.log').write_text(result.stdout)
          (root / 'runtime-stderr.log').write_text(result.stderr)
          if result.returncode != 0:
              raise SystemExit('Native Windows MSIX CLI failed after relocation')
          report = json.loads((moved / 'msix-provenance.json').read_text())
          report.update(runtimeExecutionVerified=True, runtimeVerification='Wine 11 CLI help after Unicode relocation',
                        fullApplicationPackagingVerified=False)
          (moved / 'msix-provenance.json').write_text(json.dumps(report, indent=2) + '\n')
          moved.rename(distribution)
          PYVERIFY
          tar -czf _work/windows-arm32-msix-windows-x64.tar.gz -C _work/windows-msix/distribution .
          (cd _work && sha256sum windows-arm32-msix-windows-x64.tar.gz > windows-arm32-msix-windows-x64.tar.gz.sha256)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-arm32-physical-test-bundles
          run-id: ${{ inputs.msix_fixture_run_id }}
          github-token: ${{ github.token }}
          path: _work/phone-fixture
      - name: Install genuine Microsoft XML APIs only into the isolated Wine test OS
        if: ${{ inputs.msix_xml_parser == 'msxml6' }}
        env:
          WINEPREFIX: ${{ github.workspace }}/_work/wine-msix
          WINEDLLOVERRIDES: msxml6=n,b
          WINEDEBUG: '-all'
        run: |
          apt-get install -y --no-install-recommends cabextract
          mkdir -p _work/msxml6/installer _work/msxml6/payload
          curl --fail --location --retry 3 \
            https://download.microsoft.com/download/2/7/7/277681BE-4048-4A58-ABBA-259C465B1699/msxml6-KB2957482-enu-amd64.exe \
            --output _work/msxml6/installer.exe
          echo '260cd870851ffc3c6d10b71691f134e20d8d03ac26073bb36951eacb7aa85897  _work/msxml6/installer.exe' | sha256sum --check
          cabextract -q -d _work/msxml6/installer _work/msxml6/installer.exe
          cabextract -q -d _work/msxml6/payload _work/msxml6/installer/msxml6.msi
          python3 -B - <<'PY'
          from pathlib import Path
          from dev.windows_arm32.sdk_hosts import select_host, verify_native_host
          root = Path('_work/msxml6/payload')
          for name in ('msxml6.dll', 'msxml6r.dll'):
              verify_native_host(root / (name + '.1ECC0691_D2EB_4A33_9CBF_5487E5CB17DB'), select_host('windows-x64'))
          PY
          # Wine's builtin MSXML uses libxml2's different XSD regexp grammar.
          # Keep the original Windows parser and complete validation enabled.
          export WINEPREFIX="$PWD/_work/wine-msix"
          # Replace prefix-local files rather than following builtin DLL links.
          cp --remove-destination _work/msxml6/payload/msxml6.dll.1ECC0691_D2EB_4A33_9CBF_5487E5CB17DB "$WINEPREFIX/drive_c/windows/system32/msxml6.dll"
          cp --remove-destination _work/msxml6/payload/msxml6r.dll.1ECC0691_D2EB_4A33_9CBF_5487E5CB17DB "$WINEPREFIX/drive_c/windows/system32/msxml6r.dll"
          WINEDEBUG=+loaddll,+module,+seh xvfb-run -a wine 'C:\windows\system32\regsvr32.exe' /s 'C:\windows\system32\msxml6.dll' 2>&1 | tee _work/msxml6/register-native.log
          python3 -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('_work/msxml6')
          files = {name: hashlib.sha256(path.read_bytes()).hexdigest()
              for name, path in ((n, Path('_work/wine-msix/drive_c/windows/system32') / n)
                  for n in ('msxml6.dll', 'msxml6r.dll'))}
          (root / 'ci-runtime-input.json').write_text(json.dumps({
              'source': 'Microsoft MSXML6 SP2 KB2957482 official redistributable',
              'installerSha256': '260cd870851ffc3c6d10b71691f134e20d8d03ac26073bb36951eacb7aa85897',
              'wineOsFiles': files, 'systemLibrariesCopiedToSdk': False,
              'xmlValidationDisabled': False}, indent=2) + '\n')
          PY
      - name: Verify real Phone packaging with unchanged application contents
        env:
          WINEDLLOVERRIDES: msxml6=n,b
        run: |
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('_work/phone-fixture')
          entries = [line.split() for line in (root / 'physical-bundles.sha256').read_text().splitlines()]
          matches = [sha for sha, name in entries if Path(name).name == 'physical-phone.tar.gz']
          if len(matches) != 1 or hashlib.sha256((root / 'physical-phone.tar.gz').read_bytes()).hexdigest() != matches[0]:
              raise SystemExit('Phone packaging fixture checksum failed')
          PY
          xml_args=()
          if test -f _work/msxml6/ci-runtime-input.json; then
            xml_args=(--xml-runtime-record _work/msxml6/ci-runtime-input.json)
          fi
          xvfb-run -a python3 -B dev/windows_arm32/check_windows_msix.py \
            --distribution _work/windows-msix/distribution \
            --fixture _work/phone-fixture/physical-phone.tar.gz \
            --wine-prefix _work/wine-msix \
            "${xml_args[@]}" \
            --output '_work/Phone packaging 日本語'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-arm32-msix-windows-x64
          path: |
            _work/windows-arm32-msix-windows-x64.tar.gz
            _work/windows-arm32-msix-windows-x64.tar.gz.sha256
            _work/windows-msix/distribution/msix-provenance.json
            _work/windows-msix/runtime-*.log
            _work/Phone packaging 日本語/verification.json
            _work/Phone packaging 日本語/pack-*.log
            _work/Phone packaging 日本語/unpack-*.log
            _work/Phone packaging 日本語/signature-required-*.log
            _work/msxml6/ci-runtime-input.json
            _work/msxml6/register-native.log
          if-no-files-found: warn

  frontend_generators:
    if: ${{ inputs.frontend_generators }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target_host: [linux-x64, windows-x64, macos-x64, macos-arm64]
    env:
      DEPOT_TOOLS_UPDATE: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Prepare native Ubuntu amd64 build container
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$GITHUB_WORKSPACE/_work/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/_work/tmp" >> "$GITHUB_ENV"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build git curl \
            ca-certificates python3 python3-pip python3-venv pkg-config xz-utils zip unzip \
            libxml2-dev libzstd-dev zlib1g-dev libssl-dev liblzma-dev libfreetype-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-arm32-compiler-linux-x64
          run-id: ${{ inputs.snapshot_compiler_run_id }}
          github-token: ${{ github.token }}
          path: _work/compiler-input
      - name: Verify common compiler and sync the pinned engine sources
        run: |
          mkdir -p _work/compiler
          cd _work/compiler-input
          sha256sum --check windows-arm32-compiler-linux-x64.tar.gz.sha256
          tar -xzf windows-arm32-compiler-linux-x64.tar.gz -C ../compiler
          cd ../..
          git clone --filter=blob:none --no-checkout \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git _work/depot_tools
          git -C _work/depot_tools checkout --detach b41883b1dc5a92bc7a53d69e27cfbfd320fd52ca
          export PATH="$GITHUB_WORKSPACE/_work/depot_tools:$PATH"
          python3 dev/windows_arm32/prepare_engine_checkout.py --windows-inputs
      - name: Build the matching frontend cross generator from current Dart source
        run: |
          python3 dev/windows_arm32/build_frontend_generator.py \
            --target-host '${{ matrix.target_host }}' --compiler-root _work/compiler \
            --output _work/frontend-generator --jobs 2
      - name: Verify Linux executable and record destination frontend scope
        run: |
          _work/frontend-generator/build/gen_snapshot --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-arm32-frontend-generator-${{ matrix.target_host }}
          path: |
            _work/frontend-generator/build/gen_snapshot
            _work/frontend-generator/build/args.gn
            _work/frontend-generator/frontend-generator-provenance.json
          if-no-files-found: warn

  frontend_snapshots:
    if: ${{ inputs.frontend_snapshots }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target_host: [linux-x64, windows-x64, macos-x64, macos-arm64]
    env:
      DEPOT_TOOLS_UPDATE: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Prepare Ubuntu amd64 source frontend build container
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$GITHUB_WORKSPACE/_work/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/_work/tmp" >> "$GITHUB_ENV"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates python3 xz-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-arm32-frontend-generator-${{ matrix.target_host }}
          run-id: ${{ inputs.frontend_generator_run_id }}
          github-token: ${{ github.token }}
          path: _work/frontend-generator
      - name: Sync the matching Dart source and stage the official Linux bootstrap
        run: |
          test -n '${{ inputs.frontend_generator_run_id }}'
          git clone --filter=blob:none --no-checkout \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git _work/depot_tools
          git -C _work/depot_tools checkout --detach b41883b1dc5a92bc7a53d69e27cfbfd320fd52ca
          export PATH="$GITHUB_WORKSPACE/_work/depot_tools:$PATH"
          python3 dev/windows_arm32/prepare_engine_checkout.py --windows-inputs
          mkdir -p _work/bootstrap
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.10-stable.tar.xz \
            --output _work/bootstrap.tar.xz
          echo '385e2629a0a585a835f351ca1605d2c7996377ce2fa16e68296e8fc9a78ccf7a  _work/bootstrap.tar.xz' | sha256sum --check
          tar -xJf _work/bootstrap.tar.xz --strip-components=3 -C _work/bootstrap flutter/bin/cache/dart-sdk
          rm _work/bootstrap.tar.xz
          chmod +x _work/frontend-generator/build/gen_snapshot
      - name: Generate current-source platform and destination frontend AOT
        run: |
          python3 dev/windows_arm32/build_frontend_cross.py \
            --target-host '${{ matrix.target_host }}' --dart _work/bootstrap/dart-sdk/bin/dart \
            --generator _work/frontend-generator/build/gen_snapshot \
            --generator-provenance _work/frontend-generator/frontend-generator-provenance.json \
            --output _work/frontend
      - name: Check Linux destination snapshot on the native bootstrap runtime
        if: ${{ matrix.target_host == 'linux-x64' }}
        run: |
          python3 -B - <<'PYRUNTIME'
          import json, subprocess
          from pathlib import Path
          output = Path('_work/frontend').resolve()
          source = output / 'proof.dart'
          source.write_text('void main() { print("frontend 日本語"); }\n')
          packages = output / 'package_config.json'
          packages.write_text('{"configVersion":2,"packages":[]}\n')
          result = subprocess.run([str(Path('_work/bootstrap/dart-sdk/bin/dartaotruntime').resolve()),
              str(output / 'frontend_server_aot.dart.snapshot'), '--target=vm', '--aot', '--tfa',
              '--target-os=linux', '--platform=' + str(output / 'vm_platform.dill'),
              '--sdk-root=' + str(Path('_work/bootstrap/dart-sdk').resolve()) + '/',
              '--packages=' + str(packages), '--output-dill=' + str(output / 'proof.dill'), str(source)],
              capture_output=True, text=True, timeout=180)
          (output / 'runtime-compile.log').write_text(result.stdout + result.stderr)
          if result.returncode != 0 or not (output / 'proof.dill').is_file():
              raise SystemExit('Destination Linux frontend did not compile the fixture')
          file = output / 'frontend-source-provenance.json'
          proof = json.loads(file.read_text())
          proof.update(destinationFrontendRuntimeVerified=True,
                       runtimeVerification='Official matching Linux dartaotruntime compiled a VM AOT kernel')
          file.write_text(json.dumps(proof, indent=2) + '\n')
          PYRUNTIME
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-arm32-frontend-${{ matrix.target_host }}
          path: |
            _work/frontend/frontend_server_aot.dart.snapshot
            _work/frontend/frontend-source-provenance.json
            _work/frontend/*-build.log
            _work/frontend/runtime-compile.log
          if-no-files-found: warn

  windows_frontend_runtime:
    if: ${{ inputs.windows_frontend_runtime }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 45
    env:
      TMPDIR: ${{ github.workspace }}/_work/tmp
    steps:
      - name: Prepare Ubuntu amd64 container
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$TMPDIR"
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 \
            xz-utils gnupg xvfb xauth imagemagick
          mkdir -p /etc/apt/keyrings
          curl --fail --location --retry 3 https://dl.winehq.org/wine-builds/winehq.key \
            --output /etc/apt/keyrings/winehq.asc
          echo 'd965d646defe94b3dfba6d5b4406900ac6c81065428bf9d9303ad7a72ee8d1b8  /etc/apt/keyrings/winehq.asc' | sha256sum --check
          gpg --batch --dearmor --output /etc/apt/keyrings/winehq-archive.key /etc/apt/keyrings/winehq.asc
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources \
            --output /etc/apt/sources.list.d/winehq-noble.sources
          echo 'b5962429ece1f831c9f713c13f9f0d26bb367117ef56706648ff385f004779fb  /etc/apt/sources.list.d/winehq-noble.sources' | sha256sum --check
          apt-get update
          apt-get install -y --install-recommends winehq-stable=11.0.0.0~noble-1
          # Supply Wine 11's standard addons before prefix initialization;
          # otherwise its interactive Mono installer blocks unattended tests.
          # SHA-256 values come from Wine 11.0 dlls/appwiz.cpl/addons.c.
          mkdir -p /opt/wine/mono /opt/wine/gecko
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-mono/10.4.1/wine-mono-10.4.1-x86.msi \
            --output /opt/wine/mono/wine-mono-10.4.1-x86.msi
          echo '071f4b2887e1c97a11d791ff3d65be9429eed6dec4c2708888bfd546ba358e23  /opt/wine/mono/wine-mono-10.4.1-x86.msi' | sha256sum --check
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86.msi \
            --output /opt/wine/gecko/wine-gecko-2.47.4-x86.msi
          echo '26cecc47706b091908f7f814bddb074c61beb8063318e9efc5a7f789857793d6  /opt/wine/gecko/wine-gecko-2.47.4-x86.msi' | sha256sum --check
          curl --fail --location --retry 3 \
            https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86_64.msi \
            --output /opt/wine/gecko/wine-gecko-2.47.4-x86_64.msi
          echo 'e590b7d988a32d6aa4cf1d8aa3aa3d33766fdd4cf4c89c2dcc2095ecb28d066f  /opt/wine/gecko/wine-gecko-2.47.4-x86_64.msi' | sha256sum --check
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-arm32-frontend-windows-x64
          run-id: ${{ inputs.frontend_snapshot_run_id }}
          github-token: ${{ github.token }}
          path: _work/frontend-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-arm32-engine-rt-linux-x64
          run-id: ${{ inputs.frontend_platform_run_id }}
          github-token: ${{ github.token }}
          path: _work/platform-input
      - name: Stage verified official Windows Dart and matching source platform
        run: |
          mkdir -p _work/windows-bootstrap _work/platform
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.38.10-stable.zip \
            --output _work/windows-bootstrap.zip
          echo '97e560d028f1b0b414e5f19ac2c4ebf079c001e8a18563a0e940c4d84700d334  _work/windows-bootstrap.zip' | sha256sum --check
          python3 -B - <<'PYZIP'
          import zipfile
          with zipfile.ZipFile('_work/windows-bootstrap.zip') as archive:
              for member in archive.namelist():
                  if member.startswith('flutter/bin/cache/dart-sdk/'):
                      archive.extract(member, '_work/windows-bootstrap')
          PYZIP
          rm _work/windows-bootstrap.zip
          (cd _work/platform-input && sha256sum --check windows-arm32-engine-rt-linux-x64.tar.gz.sha256)
          tar -xzf _work/platform-input/windows-arm32-engine-rt-linux-x64.tar.gz -C _work/platform \
