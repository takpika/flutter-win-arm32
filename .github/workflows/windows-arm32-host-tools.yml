            _work/windows-snapshot/snapshot-provenance.json
            _work/windows-snapshot/build/args.gn
            _work/windows-snapshot/runtime-*.log
            _work/windows-snapshot/aot-check/aot-verification.json
            _work/windows-snapshot/aot-check/aot-*.log
