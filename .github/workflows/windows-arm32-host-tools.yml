      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.snapshot_aot }}
        with:
          name: windows-arm32-engine-rt-linux-x64
          run-id: ${{ inputs.snapshot_frontend_run_id }}
          github-token: ${{ github.token }}
          path: _work/aot-engine-input
      - name: Stage the matching source frontend and ARM32 platform metadata
        if: ${{ inputs.snapshot_aot }}
        run: |
          mkdir -p _work/aot-platform
          (cd _work/aot-engine-input && sha256sum --check windows-arm32-engine-rt-linux-x64.tar.gz.sha256)
          tar -xzf _work/aot-engine-input/windows-arm32-engine-rt-linux-x64.tar.gz -C _work/aot-platform \
            ./frontend_server_aot.dart.snapshot ./frontend-source-provenance.json \
            ./flutter_patched_sdk/platform_strong.dill ./flutter_patched_sdk/vm_outline_strong.dill \
            ./engine-build-provenance.json
          python3 -B - <<'PYPLATFORM'
          import json, hashlib
          from pathlib import Path
          root = Path('_work/aot-platform')
          proof = json.loads((root / 'engine-build-provenance.json').read_text())
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          if proof['sourceManifests']['dart-source-manifest.json'] != digest(Path('dev/windows_arm32/patches/dart-source-manifest.json')):
              raise SystemExit('Platform ABI metadata does not match the current Dart sources')
          for name in ('platform_strong.dill', 'vm_outline_strong.dill'):
              path = root / 'flutter_patched_sdk' / name
              if digest(path) != proof['families']['rt']['artifacts']['flutter_patched_sdk/' + name]['sha256']:
                  raise SystemExit('Source-built platform dill changed')
          PYPLATFORM
      - name: Exercise the Windows generator with real ARM32 AOT output
        if: ${{ inputs.snapshot_aot }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_work/tmp"
          export TMPDIR="$GITHUB_WORKSPACE/_work/tmp"
